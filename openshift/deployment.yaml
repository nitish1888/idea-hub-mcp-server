apiVersion: apps/v1
kind: Deployment
metadata:
  name: idea-hub-mcp-server
  namespace: trend-analysis-using-ai--runtime-int
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idea-hub-mcp-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: idea-hub-mcp-server
    spec:
      containers:
        - name: idea-hub-mcp-server
          image: quay.io/rhn-support-nitsingh/idea-hub-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              protocol: TCP
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_HOST
              value: '0.0.0.0'
            - name: MCP_PORT
              value: '8443'
            - name: WEB_PORT
              value: '8000'
            - name: PYTHON_LOG_LEVEL
              value: 'INFO'
            # SSL disabled for now - using HTTP only
            # - name: MCP_SSL_KEYFILE
            #   value: '/run/secrets/tls/tls.key'
            # - name: MCP_SSL_CERTFILE
            #   value: '/run/secrets/tls/tls.crt'
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: database-host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: database-port
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: database-name
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: database-password
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: idea-hub-mcp-secrets
                  key: google-api-key
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # volumeMounts:
          #   - name: tls-certs
          #     mountPath: /run/secrets/tls
      restartPolicy: Always
      imagePullSecrets:
        - name: quay-pull-secret
      # volumes:
      #   - name: tls-certs
      #     secret:
      #       secretName: idea-hub-mcp-server-tls
